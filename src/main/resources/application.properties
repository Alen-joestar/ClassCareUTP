spring.application.name=herDesarrollo

# --------------------------------------------------------------------------
# Configuración del DataSource para PostgreSQL (Soportando variables de entorno)
# --------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/classcare_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------------------------------
# Configuración de Hibernate / JPA
# --------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de seguridad
app.security.tecnico.password=${APP_SECURITY_TECNICO_PASSWORD:tecnico123}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:admin123}

