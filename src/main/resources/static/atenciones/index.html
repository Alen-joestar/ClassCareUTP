<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Atenciones - ClassCare UTP</title>
    <link rel="stylesheet" href="css/atenciones.css">
</head>
<body>

<header>
    <h1>ClassCare UTP</h1>
    <p>Plataforma de Gestión de Mantenimiento de Aulas</p>
</header>

<main>
    <section>
        <h2>Bandeja de Atenciones</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Reporte</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Reporte #101</td>
                    <td><span class="estado pendiente">Pendiente</span></td>
                    <td><button class="btn">Atender</button></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Reporte #102</td>
                    <td><span class="estado en-atencion">En Atención</span></td>
                    <td><button class="btn">Resolver</button></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Reporte #103</td>
                    <td><span class="estado resuelto">Resuelto</span></td>
                    <td><button class="btn">Ver detalle</button></td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>ClassCare UTP &copy; 2026 - Módulo Atenciones</p>
</footer>

</body>
</html>
